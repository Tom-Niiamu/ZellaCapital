<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="device-route.js"></script>
    <title>Zella Capital Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .page-shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 140px;
        display: grid;
        gap: 24px;
      }
      .site-header { padding: 24px 20px 18px; }
      .brand-block { padding-left: 4px; }
      .site-nav { display: flex; gap: 12px; align-items: center; }

      /* Real, button-like top nav links (replaces plain text) */
      .top-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.28);
        color: #f8fafc;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.30);
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      }
      .top-btn::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent, #0f766e);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.25);
      }
      .top-btn:hover {
        background: #243349;
        border-color: var(--accent, #0f766e);
        transform: translateY(-1px);
      }
      .top-btn:active { transform: translateY(0); }
      /* Home button gets a solid accent so it reads as the primary action */
      .top-btn.primary {
        background: linear-gradient(135deg, #0f766e, #2563eb);
        border-color: transparent;
      }
      .top-btn.primary::before { display: none; }
      /* Recharge button (top-right) — green pill matching the checkin Recharge style */
      .top-btn.recharge {
        background: #10b981; /* Same green as the homepage Recharge button / checkin */
        border-color: transparent;
        color: #fff;
      }
      .top-btn.recharge::before { display: none; }
      .top-btn.recharge:hover { background: #0ea271; border-color: transparent; transform: translateY(-1px); }
      .activity-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .activity-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .activity-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 22px;
        background: #1e293b; /* Dark ash (news panel look) */
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.30);
        align-items: center;
      }
      .activity-details { display: grid; gap: 6px; }
      .activity-type { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text); }
      .activity-desc, .activity-time { margin: 0; color: #cbd5e1; font-size: 0.92rem; line-height: 1.5; }
      .activity-time { color: #94a3b8; }
      .activity-amount {
        text-align: right;
        font-weight: 700;
        color: var(--text);
        min-width: 110px;
        white-space: nowrap;
      }
      .credit { color: #2dd4bf; }
      .debit { color: #facc15; }
      .activity-note { margin: 0; color: #94a3b8; font-size: 0.85rem; }
      .quick-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
      }
      .summary-card {
        padding: 18px;
        border-radius: 22px;
        background: #1e293b; /* Dark ash (news panel look) */
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.30);
      }
      .summary-card h3 { margin: 0 0 8px; font-size: 0.95rem; color: #cbd5e1; }
      .summary-card strong { display: block; font-size: 1.45rem; color: var(--text); }

      @media (max-width: 760px) {
        .activity-item { grid-template-columns: 1fr; }
        .activity-amount { text-align: left; }
        .quick-summary { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">Funding details</p>
        <h1>Financial activity</h1>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="top-btn primary">Home</a>
        <a href="login.html" class="top-btn recharge">Sign in</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="info-card" style="padding: 24px;">
        <h2>All financial transactions</h2>
        <div class="quick-summary">
          <div class="summary-card">
            <h3>Total balance change</h3>
            <strong id="totalBalanceChange">+ 0.00 USDT</strong>
          </div>
          <div class="summary-card">
            <h3>Last activity</h3>
            <strong id="lastActivity">—</strong>
          </div>
          <div class="summary-card">
            <h3>Records stored</h3>
            <strong id="recordCount">0</strong>
          </div>
        </div>
      </section>

      <section class="info-card" style="padding: 24px;">
        <div class="activity-header">
          <div><h2>Transaction history</h2></div>
        </div>
        <ul id="activityList" class="activity-list"></ul>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V7l8-4z" /><path d="M12 8v4M10 12h4" /></svg>
        <span>Home</span>
      </a>
      <a href="product.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M6 8h12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8z" /><path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2" /></svg>
        <span>Product</span>
      </a>
      <a href="news.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" /><path d="M8 8h8M8 12h8M8 16h5" /></svg>
        <span>News</span>
      </a>
      <a href="me.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M6 20v-1a6 6 0 0 1 12 0v1" /></svg>
        <span>Me</span>
      </a>
    </nav>

    <script type="module" src="database.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module">
      import { supabase } from './supabase.js';

      function formatDateTime(value) {
        if (!value) return 'Pending';
        try {
          return new Date(value).toLocaleString();
        } catch (error) {
          return value;
        }
      }

      function formatMoney(amount) {
        return Number(amount || 0).toFixed(2);
      }

      function renderRecords(records) {
        const list = document.getElementById('activityList');
        const count = document.getElementById('recordCount');
        const totalEl = document.getElementById('totalBalanceChange');
        const lastEl = document.getElementById('lastActivity');

        list.innerHTML = '';

        if (!records || !records.length) {
          list.innerHTML = '<li class="activity-item"><div class="activity-details"><p class="activity-type">No transactions yet</p><p class="activity-time">Your approved funding activity will appear here.</p></div></li>';
          count.textContent = '0';
          totalEl.textContent = '+ 0.00 USDT';
          lastEl.textContent = '—';
          return;
        }

        // Calculate total balance change (sum of all credits)
        const totalCredits = records
          .filter(r => r.direction === 'credit')
          .reduce((sum, r) => sum + Number(r.amount), 0);
        const totalDebits = records
          .filter(r => r.direction === 'debit')
          .reduce((sum, r) => sum + Number(r.amount), 0);
        const netChange = totalCredits - totalDebits;

        totalEl.textContent = (netChange >= 0 ? '+ ' : '- ') + formatMoney(Math.abs(netChange)) + ' USDT';
        lastEl.textContent = records[0].type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        count.textContent = records.length;

        records.forEach((record) => {
          const isCredit = record.direction === 'credit';
          const item = document.createElement('li');
          item.className = 'activity-item';
          item.innerHTML = `
            <div class="activity-details">
              <p class="activity-type">${record.type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
              <p class="activity-desc">${record.description || 'No description'}</p>
              <p class="activity-time">${formatDateTime(record.created_at)}</p>
            </div>
            <div class="activity-amount ${isCredit ? 'credit' : 'debit'}">
              ${isCredit ? '+' : '-'}${formatMoney(record.amount)} USDT
            </div>
          `;
          list.appendChild(item);
        });
      }

      async function loadTransactions() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) {
            window.location.replace('login.html');
            return;
          }

          const { data: transactions, error } = await supabase
            .from('transactions')
            .select('type, amount, direction, description, created_at')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Transaction fetch error:', error);
            renderRecords([]);
            return;
          }

          renderRecords(transactions);
        } catch (err) {
          console.error('Load error:', err);
          renderRecords([]);
        }
      }

      loadTransactions();
    </script>
  </body>
</html>
