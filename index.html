<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="device-route.js"></script>
  <title>Zella Capital</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <style>
      /* Exact replica of the news page header. The news page only loads
         styles.css (NOT pages.css), so its header uses styles.css header
         padding (20px) plus default browser p/h1 sizing. pages.css would
         otherwise shrink this header, so we override its rules back to the
         news page's exact values. Only the eyebrow text differs
         ("Welcome" vs "Latest updates"). */
      .site-header {
        padding: 20px;
        background: transparent;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }

      .brand-block .eyebrow {
        margin: 1em 0;          /* default <p> spacing */
        font-size: 1em;         /* default ~16px */
        letter-spacing: normal;
        text-transform: none;
        color: #93c5b1;
        font-weight: 400;
      }

      /* Redeem bonus "coming soon" toast */
      .popup-message {
        position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
        min-width: 280px; max-width: 90%; padding: 14px 18px; border-radius: 18px;
        background: rgba(15,118,110,0.95); color: #fff; font-weight: 700; text-align: center;
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease-in-out; z-index: 1000;
      }
      .popup-message.visible { opacity: 1; pointer-events: auto; }

      .brand-block h1 {
        margin: 0.67em 0;       /* default <h1> spacing */
        font-size: 2em;         /* default ~32px */
        font-weight: 700;
        color: #f8fafc;
      }

      .site-nav a {
        color: #cbd5e1;
        background: transparent;
        border: 0;
      }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand-block">
            <p class="eyebrow">Welcome</p>
            <h1>Zella Capital</h1>
        </div>
    </header>

    <div class="carousel">
        <div class="carousel-item"></div>
    </div>

    <section class="grid-menu">
        <a class="menu-item" href="invite.html">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <div>Invite</div>
        </a>
        <a class="menu-item" href="product.html">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <div>Product</div>
        </a>
        <a class="menu-item js-redeem-bonus" href="#" role="button">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            <div>Redeem bonus</div>
        </a>
        <a class="menu-item" href="chat.html">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <div>Chat</div>
        </a>
    </section>

    <section class="action-buttons">
        <a class="recharge" href="recharge.html">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9" /><path d="M12 7v10" /><path d="M8.5 10.5 12 7l3.5 3.5" /></svg>
            Recharge
        </a>

        <a class="withdraw" href="withdrawal.html">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9" /><path d="M12 17V7" /><path d="M8.5 13.5 12 17l3.5-3.5" /></svg>
            Withdraw
        </a>

    </section>

    <section class="news">
        <h2>News</h2>
        <div id="rotating-news" class="news-card">
            <!-- News will be injected here by script -->
            <p id="news-title">Loading news...</p>
            <p id="news-excerpt"></p>
        </div>
    </section>

    <script>
        const newsData = [
            { title: "🤝 Building a culture of trusted growth at Zella Capital", excerpt: "Discover how our team combines safe funding, customer support, and transparent reporting for a better investor experience." },
            { title: "📊 Market outlook: Crypto-backed finance in 2026", excerpt: "Our latest research review examines the evolving market, premium return strategies, and the future of digital asset-backed plans." },
            { title: "📈 Zella Capital’s journey: From startup to premium finance service", excerpt: "Read our story and learn how Zella Capital built a stable funding platform focused on transparency and performance." },
            { title: "🌍 Expanding Zella Capital’s services into Ghana and West Africa", excerpt: "Our next phase brings local support, smarter funding options, and expanded access for regional investors." }
        ];

        let currentIndex = 0;
        const titleEl = document.getElementById('news-title');
        const excerptEl = document.getElementById('news-excerpt');

        function updateNews() {
            titleEl.textContent = newsData[currentIndex].title;
            excerptEl.textContent = newsData[currentIndex].excerpt;
            currentIndex = (currentIndex + 1) % newsData.length;
        }

        updateNews(); // Initial call
        setInterval(updateNews, 15000); // Rotate every 15 seconds
    </script>

    <div id="redeemPopup" class="popup-message" role="alert" aria-live="assertive"></div>

    <script>
      (function () {
        const redeemTriggers = document.querySelectorAll('.js-redeem-bonus');
        const popup = document.getElementById('redeemPopup');
        let redeemTimer;
        redeemTriggers.forEach((el) => {
          el.addEventListener('click', (e) => {
            e.preventDefault();
            popup.textContent = 'Redeem bonus coming soon!';
            popup.classList.add('visible');
            clearTimeout(redeemTimer);
            redeemTimer = setTimeout(() => popup.classList.remove('visible'), 2500);
          });
        });
      })();
    </script>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V7l8-4z" /><path d="M12 8v4M10 12h4" /></svg>
        <span>Home</span>
      </a>
      <a href="product.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M6 8h12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8z" /><path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2" /></svg>
        <span>Product</span>
      </a>
      <a href="news.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" /><path d="M8 8h8M8 12h8M8 16h5" /></svg>
        <span>News</span>
      </a>
      <a href="me.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M6 20v-1a6 6 0 0 1 12 0v1" /></svg>
        <span>Me</span>
      </a>
    </nav>
    <script type="module" src="./auth.js"></script>
</body>
</html>
