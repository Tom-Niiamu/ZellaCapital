<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Auth protection is handled by the async guard after database.js loads and by auth.js. -->
    <title>Zella Capital | Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../pages.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">Support</p>
        <h1>Chat</h1>
      </div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Sign in</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="chat-window" aria-label="Chat with support">
        <div id="chatMessages" class="chat-messages">
          <div class="msg bot">Hi there! 👋 Welcome to Zella Capital support. How can we help you today?</div>
        </div>
        <form id="chatForm" class="chat-input-row" autocomplete="off">
          <input id="chatInput" class="chat-input" type="text" placeholder="Type a message…" aria-label="Type a message" />
          <button class="chat-send" type="submit" aria-label="Send message">Send</button>
        </form>
      </section>
    </main>

    <script type="module" src="../database.js"></script>
    <script>
      (async () => {
        try {
          const { data: { session } } = await import('../supabase.js').then(m => m.supabase.auth.getSession());
          if (!session) {
            window.location.replace('login.html');
            return;
          }
        } catch (error) {
          window.location.replace('login.html');
          return;
        }

        const messages = document.getElementById('chatMessages');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('chatInput');

        const addMessage = (text, who) => {
          const el = document.createElement('div');
          el.className = 'msg ' + who;
          el.textContent = text;
          messages.appendChild(el);
          messages.scrollTop = messages.scrollHeight;
        };

        const replies = [
          "Thanks for reaching out! A member of our team will follow up shortly.",
          "You can also check the Me page for Wallet, Recharge and Redeem bonus options.",
          "For funding help, open Funding details from your profile.",
          "Is there anything else we can help you with?"
        ];
        let replyIndex = 0;

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          addMessage(text, 'me');
          input.value = '';
          setTimeout(() => {
            addMessage(replies[replyIndex % replies.length], 'bot');
            replyIndex += 1;
          }, 500);
        });
      })();
    </script>
    <script src="../device-route.js"></script>
    <script type="module" src="../auth.js"></script>

    <footer class="site-footer">
      <p>© 2026 Zella Capital. Secure, transparent finance.</p>
    </footer>
  </body>
</html>
