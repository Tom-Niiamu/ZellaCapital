<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="device-route.js"></script>
    <title>Zella Capital | Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="deposit.css" />
    <style>
      .wallet-card {
        max-width: 720px;
        margin: 0 auto;
      }
      .wallet-form {
        display: grid;
        gap: 16px;
      }
      .wallet-submit {
        width: 100%;
        padding: 14px 16px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #0f766e, #2563eb);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .wallet-message {
        min-height: 24px;
        margin: 0;
        color: #0f766e;
        font-weight: 600;
      }
      .wallet-message.error {
        color: #b42318;
      }
      .wallet-card .eyebrow {
        font-size: 0.78rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 700;
        color: #2563eb;
        margin-bottom: 8px;
      }
      #wallet-title {
        font-size: 1.75rem;
        line-height: 1.1;
        margin-bottom: 6px;
        font-weight: 700;
      }
      .wallet-card .subtext {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .site-header { display: flex; align-items: center; gap: 16px; }
      .site-header .site-nav { margin-left: auto; display: flex; align-items: center; }

      /* Real, button-like top nav link — uses the checkin "Recharge" green style */
      .top-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        background: #10b981; /* Same green as the homepage Recharge button */
        border: 1px solid transparent;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.30);
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      }
      .top-btn:hover {
        background: #0ea271;
        border-color: transparent;
        transform: translateY(-1px);
      }
      .top-btn:active { transform: translateY(0); }

      /* Dashboard pill — green, matches the recharge page Dashboard button */
      .dashboard-link {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 18px; border-radius: 999px;
        background: #10b981; border: 1px solid transparent;
        color: #fff; font: inherit; font-weight: 600; font-size: 0.9rem;
        text-decoration: none; cursor: pointer;
        box-shadow: 0 4px 12px rgba(2, 6, 23, 0.30);
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      }
      .dashboard-link:hover { background: #0ea271; border-color: transparent; transform: translateY(-1px); }
      .dashboard-link:active { transform: translateY(0); }

      /* ===== NEW: Balance & Transaction Styles ===== */
      .balance-section {
        text-align: center;
        padding: 24px;
        background: linear-gradient(135deg, #0f766e, #2563eb);
        border-radius: 16px;
        color: white;
        margin-bottom: 24px;
      }
      .balance-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0.9;
        margin-bottom: 8px;
      }
      .balance-amount {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0;
      }
      .transaction-section {
        margin-top: 32px;
      }
      .transaction-section h3 {
        font-size: 1.1rem;
        margin-bottom: 16px;
        color: var(--text);
      }
      .txn-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-radius: 12px;
        background: #f8fafc;
        margin-bottom: 8px;
        font-size: 0.9rem;
      }
      .txn-row.credit { border-left: 3px solid #0f766e; }
      .txn-row.debit { border-left: 3px solid #b42318; }
      .txn-type { font-weight: 600; text-transform: capitalize; }
      .txn-amount { font-weight: 700; }
      .txn-amount.credit { color: #0f766e; }
      .txn-amount.debit { color: #b42318; }
      .txn-desc { color: var(--muted); font-size: 0.8rem; flex: 1; margin: 0 12px; }
      .txn-date { color: var(--muted); font-size: 0.75rem; }
      .no-txns { color: var(--muted); text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">Secure wallet</p>
        <h1>Wallet</h1>
      </div>
      <nav class="site-nav">
        <a href="me.html" class="dashboard-link">Dashboard</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="deposit-card wallet-card" aria-labelledby="wallet-title">
        <div class="card-top">
          <div>
            <p class="eyebrow">Wallet address</p>
            <h2 id="wallet-title">Your Wallet</h2>
            <p class="subtext">View your balance, transaction history, and manage your withdrawal address.</p>
          </div>
          <a class="ghost-link" href="index.html">Back</a>
        </div>

        <!-- ===== NEW: Balance Display ===== -->
        <div class="balance-section">
          <div class="balance-label">Available Balance</div>
          <div id="walletBalance" class="balance-amount">$0.00</div>
        </div>

        <!-- Withdrawal Address Form -->
        <form id="walletForm" class="wallet-form" novalidate>
          <div class="field-group">
            <label class="field-label" for="walletAddressInput">Withdrawal Address</label>
            <input id="walletAddressInput" class="text-field" type="text" placeholder="Enter your wallet address" required />
          </div>
          <button type="submit" class="wallet-submit">Save Address</button>
          <p id="walletMessage" class="wallet-message" aria-live="polite"></p>
        </form>

        <!-- ===== NEW: Transaction History ===== -->
        <div class="transaction-section">
          <h3>Recent Transactions</h3>
          <div id="walletTransactions">
            <div class="no-txns">Loading transactions...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Zella Capital. Secure, transparent finance.</p>
    </footer>

    <script type="module" src="database.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="wallet.js"></script>
  </body>
</html>
