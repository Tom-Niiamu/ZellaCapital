<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Auth protection is handled by the async guard after database.js loads and by auth.js. -->
    <script src="device-route.js"></script>
  <title>Zella Capital | Invite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
    <style>
      html, body { height: 100%; }
      body { height: 100vh; overflow: hidden; }
      .page-shell {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .page-card { padding: clamp(28px, 4vw, 40px); }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">Refer a friend</p>
        <h1>Invite</h1>
      </div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Sign in</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="page-card" aria-label="Invite friends">
        <h2>Share your invite link</h2>
        <p class="subtext">Invite friends to Zella Capital and earn rewards together when they join.</p>

        <div class="referral-box">
          <input id="referralLink" class="referral-link" type="text" readonly aria-label="Your invite link" />
          <button id="copyBtn" class="copy-btn" type="button">Copy</button>
        </div>

        <div class="share-grid">
          <a id="shareWhatsApp" class="share-btn" href="#" target="_blank" rel="noopener">WhatsApp</a>
          <a id="shareSMS" class="share-btn" href="#">SMS</a>
        </div>

        <p class="invite-note">Your invite link is generated from your account. Share it to start earning referral rewards.</p>
        <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>

    <script type="module" src="database.js"></script>
    <script>
      (async () => {
        try {
          const { data: { session } } = await import('./supabase.js').then(m => m.supabase.auth.getSession());
          const currentUser = session ? { id: session.user.id } : null;
          if (!currentUser) {
            window.location.replace('login.html');
            return;
          }

          const base = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
          const referralLink = base + 'signup.html?ref=' + encodeURIComponent(currentUser.id);

          const linkInput = document.getElementById('referralLink');
          const text = 'Join me on Zella Capital: ' + referralLink;

          linkInput.value = referralLink;

          const toast = document.getElementById('toast');
          const showToast = (message) => {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
          };

          document.getElementById('copyBtn').addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(referralLink);
              showToast('Invite link copied!');
            } catch {
              linkInput.select();
              document.execCommand('copy');
              showToast('Invite link copied!');
            }
          });

          document.getElementById('shareWhatsApp').addEventListener('click', (e) => {
            e.preventDefault();
            window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
          });

          document.getElementById('shareSMS').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'sms:?&body=' + encodeURIComponent(text);
          });
        } catch (error) {
          window.location.replace('login.html');
        }
      })();
    </script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
